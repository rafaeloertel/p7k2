<script>/* js/fin-importar.js */
/* Finanças › Importar extrato (banco ou cartão) com conciliação — inspirado na importação da CAP do ERP NMB
   (lote com desfazer, aviso de duplicidade, casamento automático). Lê CSV (;,\t) e OFX. */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, num, todayISO, fdate, monthKey, monthLabel, parseNum, Store } = ERP;
  const F = ERP.fin; const D = F.D;
  const norm = (s) => String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const STOP = new Set("de da do das dos e em no na com para por pag pagto pagamento compra debito credito pix ted doc transf transferencia ltda me sa eireli".split(" "));
  const tokens = (s) => norm(s).split(" ").filter((t) => t.length > 2 && !STOP.has(t) && !/^\d+$/.test(t));

  /* ---------- leitura de arquivos ---------- */
  function parseDate(s) {
    s = String(s || "").trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    m = s.match(/^(\d{2})[\/.-](\d{2})[\/.-](\d{4})/); if (m) return `${m[3]}-${m[2]}-${m[1]}`;
    m = s.match(/^(\d{2})[\/.-](\d{2})[\/.-](\d{2})$/); if (m) return `20${m[3]}-${m[2]}-${m[1]}`;
    m = s.match(/^(\d{4})(\d{2})(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
    return "";
  }
  function parseOFX(txt) {
    const out = []; const re = /<STMTTRN>([\s\S]*?)<\/STMTTRN>/gi; let m;
    const tag = (b, t) => { const r = new RegExp("<" + t + ">([^<\\r\\n]*)", "i").exec(b); return r ? r[1].trim() : ""; };
    while ((m = re.exec(txt))) { const b = m[1]; const dt = parseDate(tag(b, "DTPOSTED")); const v = parseFloat(String(tag(b, "TRNAMT")).replace(",", ".")); const d = tag(b, "MEMO") || tag(b, "NAME") || tag(b, "PAYEE"); if (dt && !isNaN(v)) out.push({ data: dt, desc: d, valor: v, ref: tag(b, "FITID") }); }
    return out;
  }
  function splitCSV(line, sep) {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) { const c = line[i]; if (c === '"') { if (q && line[i + 1] === '"') { cur += '"'; i++; } else q = !q; } else if (c === sep && !q) { out.push(cur); cur = ""; } else cur += c; }
    out.push(cur); return out.map((x) => x.trim());
  }
  function parseCSV(txt) {
    const lines = txt.replace(/\r/g, "").split("\n").filter((l) => l.trim());
    if (!lines.length) return [];
    const sep = [";", ",", "\t"].map((s) => [s, (lines[0].match(new RegExp("\\" + s, "g")) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
    const head = splitCSV(lines[0], sep).map((h) => norm(h));
    const idx = (names) => head.findIndex((h) => names.some((n) => h.includes(n)));
    let iD = idx(["data", "date", "dt "]), iDesc = idx(["descricao", "historico", "description", "memo", "lancamento", "estabelecimento", "titulo"]), iV = idx(["valor", "amount", "value", "montante"]);
    const iDeb = idx(["debito", "debit", "saida"]), iCre = idx(["credito", "credit", "entrada"]);
    const temHead = iD >= 0 && (iV >= 0 || iDeb >= 0 || iCre >= 0);
    const rows = temHead ? lines.slice(1) : lines;
    if (!temHead) { iD = 0; iDesc = 1; iV = 2; }
    const out = [];
    rows.forEach((l) => {
      const c = splitCSV(l, sep); const dt = parseDate(c[iD]); if (!dt) return;
      let v = null;
      if (iV >= 0 && c[iV] !== undefined && c[iV] !== "") v = parseNum(c[iV]);
      else if (iDeb >= 0 || iCre >= 0) { const deb = iDeb >= 0 ? parseNum(c[iDeb]) : 0, cre = iCre >= 0 ? parseNum(c[iCre]) : 0; v = cre - Math.abs(deb); }
      if (v == null || isNaN(v) || v === 0) return;
      /* sinal explícito em texto (D/C) */
      const dc = c.find((x) => /^[DC]$/i.test(x)); if (dc && /^D$/i.test(dc)) v = -Math.abs(v);
      out.push({ data: dt, desc: iDesc >= 0 ? c[iDesc] : c.filter((x) => isNaN(parseNum(x)) || x.length > 12).join(" "), valor: v });
    });
    return out;
  }
  function parseFile(name, txt) {
    if (/\.ofx$|\.qfx$/i.test(name) || /<OFX>|<STMTTRN>/i.test(txt)) return parseOFX(txt);
    return parseCSV(txt);
  }

  /* ---------- conciliação ---------- */
  const diasEntre = (a, b) => Math.round((new Date(b) - new Date(a)) / 864e5);
  function sugerirCategoria(desc, tipo) {
    const tk = tokens(desc); if (!tk.length) return null;
    let best = null, bs = 0;
    D().lanc.forEach((l) => { if (!l.catId) return; if ((tipo === "receita") !== (l.tipo === "receita")) return; const lt = tokens(l.desc); const inter = tk.filter((t) => lt.includes(t)).length; if (inter > bs) { bs = inter; best = l; } });
    (D().favorecidos || []).forEach((f) => { const ft = tokens(f.nome); const inter = tk.filter((t) => ft.includes(t)).length; if (inter > bs && f.catId) { bs = inter; best = { catId: f.catId, favId: f.id, desc: f.nome }; } });
    return best ? { catId: best.catId, favId: best.favId || "", desc: best.desc } : null;
  }
  function conciliar(trans, origem) {
    const cc = origem.startsWith("cc:"); const oid = origem.slice(3); const d = D(); const usados = new Set();
    return trans.map((t) => {
      const tipo = t.valor < 0 ? "despesa" : "receita"; const abs = Math.abs(t.valor);
      const cand = d.lanc.filter((l) => !usados.has(l.id) && Math.abs(l.valor - abs) < 0.011 && Math.abs(diasEntre(l.venc || l.comp, t.data)) <= 5 && (cc ? l.tipo === "compra" && l.cartaoId === oid : (l.tipo === tipo && (l.contaId === oid || !l.contaId))));
      const aberto = cand.find((l) => !l.pago && !cc); const pago = cand.find((l) => l.pago || cc);
      let acao, lanc = null, motivo = "";
      if (aberto) { acao = "baixar"; lanc = aberto; usados.add(aberto.id); motivo = `casa com "${aberto.desc}" (${fdate(aberto.venc)})`; }
      else if (pago) { acao = "ignorar"; lanc = pago; usados.add(pago.id); motivo = `já lançado: "${pago.desc}"`; }
      else { acao = "criar"; const sg = sugerirCategoria(t.desc, tipo); motivo = sg ? `categoria sugerida por "${sg.desc}"` : "sem categoria sugerida"; t.sug = sg; }
      return Object.assign({}, t, { tipo, abs, acao, lanc, motivo });
    });
  }

  /* ---------- tela ---------- */
  function abrir() {
    const d = D();
    const origens = F.contasAtivas().map((c) => ["ct:" + c.id, "🏦 " + c.nome]).concat(d.cartoes.filter((c) => c.ativo !== false).map((c) => ["cc:" + c.id, "💳 " + c.nome]));
    const ult = (d.importacoes || []).slice(-1)[0];
    const m = ERP.modal(`<h2>Importar Extrato</h2>
      <p class="mut" style="margin-bottom:12px">Arquivo <b>CSV</b> ou <b>OFX</b> exportado do banco ou do cartão. O Hub casa cada linha com os lançamentos em aberto (mesmo valor, até 5 dias), marca como pago, e sugere criar o que falta. Dá para desfazer o lote inteiro.</p>
      <div class="fg"><div class="f"><label>Conta ou Cartão</label><select id="imOrig">${origens.map((o) => `<option value="${o[0]}">${esc(o[1])}</option>`).join("")}</select></div>
      <div class="f"><label>Arquivo</label><input type="file" id="imFile" accept=".csv,.txt,.ofx,.qfx"></div></div>
      <div id="imPrev" style="margin-top:12px"></div>
      <div class="act"><span class="sp"></span>${ult ? `<button type="button" class="btn ghost" id="imUndo" title="${esc(ult.em)}">Desfazer Última Importação (${ult.n})</button>` : ""}<button type="button" class="btn ghost" data-cancel>Fechar</button><button type="button" class="btn orange" id="imApply" disabled>Aplicar</button></div>`, { wide: true });
    $("[data-cancel]", m.el).onclick = m.close;
    let linhas = [];
    const prev = $("#imPrev", m.el), apply = $("#imApply", m.el);
    const cats = (tipo) => (ERP.finUI.catOpts(tipo === "receita" ? "receita" : "despesa")).map((x) => x[0] === "__grp" ? `<optgroup label="${esc(x[1])}"></optgroup>` : `<option value="${x[0]}">${esc(x[1])}</option>`).join("");
    function pintar() {
      if (!linhas.length) { prev.innerHTML = `<div class="empty">Nenhuma linha reconhecida. Confira se o arquivo tem colunas de data, descrição e valor.</div>`; apply.disabled = true; return; }
      const n = { baixar: 0, criar: 0, ignorar: 0 }; linhas.forEach((l) => n[l.acao]++);
      prev.innerHTML = `<div class="mut" style="margin-bottom:8px">${linhas.length} linha(s): <b>${n.baixar}</b> para baixar · <b>${n.criar}</b> para criar · <b>${n.ignorar}</b> ignoradas</div>
        <div class="tw" style="max-height:46vh;overflow:auto"><table><thead><tr><th>Data</th><th>Descrição</th><th class="r">Valor</th><th>Ação</th><th>Categoria / Motivo</th></tr></thead><tbody>${linhas.map((l, i) => `<tr><td style="white-space:nowrap">${fdate(l.data)}</td><td>${esc(l.desc)}</td><td class="r ${l.tipo === "receita" ? "pos" : "neg"}">${brl(l.abs)}</td><td><select data-ac="${i}" class="sm"><option value="baixar" ${l.acao === "baixar" ? "selected" : ""} ${l.lanc && !l.lanc.pago ? "" : "disabled"}>Baixar</option><option value="criar" ${l.acao === "criar" ? "selected" : ""}>Criar</option><option value="ignorar" ${l.acao === "ignorar" ? "selected" : ""}>Ignorar</option></select></td><td class="mut" style="font-size:12px">${l.acao === "criar" ? `<select data-cat="${i}" class="sm">${cats(l.tipo)}</select>` : esc(l.motivo)}</td></tr>`).join("")}</tbody></table></div>`;
      linhas.forEach((l, i) => { const cs = $(`[data-cat="${i}"]`, prev); if (cs) { cs.value = l.sug && [...cs.options].some((o) => o.value === l.sug.catId) ? l.sug.catId : cs.options[1] ? cs.options[1].value : ""; l.catId = cs.value; cs.onchange = () => { l.catId = cs.value; }; } });
      $$("[data-ac]", prev).forEach((sel) => (sel.onchange = () => { linhas[+sel.dataset.ac].acao = sel.value; pintar(); }));
      apply.disabled = !linhas.some((l) => l.acao !== "ignorar");
    }
    $("#imFile", m.el).onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      const buf = await f.arrayBuffer(); let txt = new TextDecoder("utf-8").decode(buf); if (/\uFFFD/.test(txt)) txt = new TextDecoder("windows-1252").decode(buf);
      const trans = parseFile(f.name, txt); linhas = conciliar(trans, $("#imOrig", m.el).value); pintar();
    };
    $("#imOrig", m.el).onchange = () => { if (linhas.length) { linhas = conciliar(linhas, $("#imOrig", m.el).value); pintar(); } };
    apply.onclick = () => {
      const origem = $("#imOrig", m.el).value; const cc = origem.startsWith("cc:"); const oid = origem.slice(3);
      const lote = uid("imp"); let nb = 0, ncr = 0;
      ERP.finUI.salvar((dd) => {
        linhas.forEach((l) => {
          if (l.acao === "baixar" && l.lanc) { const x = dd.lanc.find((y) => y.id === l.lanc.id); if (x && !x.pago) { x.pago = l.data; x.valorPago = l.abs; x.estimado = false; if (!cc) x.contaId = oid; x.lote = lote; x.hist = (x.hist || []).concat({ em: new Date().toISOString(), o: "Baixado pela importação do extrato" }); nb++; } }
          else if (l.acao === "criar") {
            const x = { id: uid("l"), desc: (l.sug && l.sug.desc && tokens(l.desc).length < 2 ? l.sug.desc : l.desc).slice(0, 80), catId: l.catId || "", favId: l.sug ? l.sug.favId || "" : "", valor: l.abs, notas: "Importado do extrato", forma: cc ? "Cartão de Crédito" : "", classe: "", centro: "", moeda: "BRL", lote, criado: Date.now(), hist: [{ em: new Date().toISOString(), o: "Criado pela importação do extrato" }] };
            if (cc) { const c = F.cartao(oid); Object.assign(x, { tipo: "compra", cartaoId: oid, comp: l.data, venc: l.data, fatura: c ? F.faturaDe(c, l.data).key : monthKey(l.data), pago: null }); }
            else Object.assign(x, { tipo: l.tipo, contaId: oid, comp: l.data, venc: l.data, pago: l.data, valorPago: l.abs });
            dd.lanc.push(x); ncr++;
          }
        });
        dd.importacoes = (dd.importacoes || []).concat({ id: lote, em: new Date().toLocaleString("pt-BR"), origem, n: nb + ncr, baixados: nb, criados: ncr }).slice(-10);
      });
      m.close(); ERP.toast(`Importação aplicada: ${nb} baixado(s), ${ncr} criado(s).`); ERP.render();
    };
    const undo = $("#imUndo", m.el); if (undo) undo.onclick = () => desfazer(ult.id, m);
  }
  function desfazer(lote, m) {
    ERP.confirm("Desfazer a última importação? Os lançamentos criados por ela são removidos e os baixados voltam a ficar em aberto.", "Desfazer").then((ok) => {
      if (!ok) return;
      ERP.finUI.salvar((dd) => {
        dd.lanc = dd.lanc.filter((l) => !(l.lote === lote && (l.hist || []).some((h) => /Criado pela importação/.test(h.o))));
        dd.lanc.forEach((l) => { if (l.lote === lote) { l.pago = null; l.valorPago = null; delete l.lote; l.hist = (l.hist || []).concat({ em: new Date().toISOString(), o: "Baixa desfeita (importação revertida)" }); } });
        dd.importacoes = (dd.importacoes || []).filter((i) => i.id !== lote);
      });
      if (m) m.close(); ERP.toast("Importação desfeita."); ERP.render();
    });
  }
  ERP.finImportar = { abrir, parseFile, conciliar, desfazer };
})();

<script>/* js/fin-visoes.js */
/* Finanças Pessoais — visões reorganizadas (v0.9): Visão Geral, Contas Ativas, Fluxo de Caixa, A Pagar / Receber,
   Cadastros com abas e menu "Mais". Cada tela responde uma pergunta e cabe numa página. O Painel antigo vira "Análise Detalhada". */
(function () {
  "use strict";
  const { $, $$, esc, brl, num, todayISO, fdate, monthKey, monthLabel, Store } = ERP;
  const F = ERP.fin, U = ERP.finUI, D = F.D, S = U.S;
  const MES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
  const alpha = (hex, a) => { const h = String(hex).replace("#", ""); if (h.length < 6) return hex; return `rgba(${parseInt(h.slice(0, 2), 16)},${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${a})`; };
  const kfmt = (v) => (Math.abs(v) >= 1000 ? num(v / 1000, Math.abs(v) >= 10000 ? 0 : 1) + " mil" : num(v, 0));
  const eixoR$ = () => ({ ticks: { callback: (v) => kfmt(v) }, grid: { color: () => ERP.cor("--line") } });
  const COR = () => ({ ent: ERP.cor("--ok"), sai: ERP.cor("--err"), warn: ERP.cor("--warn"), navy: ERP.cor("--navy"), orange: ERP.cor("--orange"), ink2: ERP.cor("--ink-2"), fixo: "#3F6DB3", variavel: "#C9922E", cartao: "#8A63C2", inv: "#2E9E6B" });
  const canvas = (id, h) => `<div class="fp-chart" style="height:${h || 240}px"><canvas id="${id}"></canvas></div>`;
  const sec = (t, n, extra) => `<div class="vg-sec"><h2>${esc(t)}${n ? ` <small>${n}</small>` : ""}</h2>${extra || ""}</div>`;
  const kpi = (l, v, s, cls, href, cor, help) => `<${href ? `a href="${href}"` : "div"} class="kpi fp-k ${cls || ""}" style="--kc:${cor || "var(--accent)"}"><div class="l">${esc(l)}${help ? ERP.help(help) : ""}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</${href ? "a" : "div"}>`;
  const hoje = () => todayISO();
  const mkHoje = () => monthKey(hoje());
  const fx = () => (ERP.investimentos && ERP.investimentos.fx && +ERP.investimentos.fx()) || 0;
  const valorSerie = (s) => (s.moeda === "USD" && fx() ? F.r2(s.valorMoeda * fx()) : +s.valor || 0);
  const mensal = (s) => valorSerie(s) / (s.passo || 1);
  const dinheiro = (l) => (l.valorPago != null ? l.valorPago : l.valor);
  const fdm = (iso) => fdate(iso).replace(/\/20(\d\d)$/, "/$1");
  const origemTxt = (l) => (l.cartaoId ? "💳 " + esc((F.cartao(l.cartaoId) || {}).nome || "") : "🏦 " + esc((F.conta(l.contaId) || {}).nome || ""));
  const porMesLabel = (mk) => MES[+mk.slice(5) - 1] + "/" + mk.slice(2, 4);
  const acoes = (root) => {
    $$("[data-pay]", root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); U.pagar(b.dataset.pay); }));
    $$("[data-est]", root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); U.estornar(b.dataset.est); }));
    $$("[data-ed]", root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); U.lancForm(D().lanc.find((x) => x.id === b.dataset.ed)); }));
    $$("[data-payf]", root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const [c, k] = b.dataset.payf.split("|"); U.pagarFatura(c, k); }));
    $$("[data-sr]", root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const s = D().series.find((x) => x.id === b.dataset.sr); if (s) U.serieF(s); }));
  };

  /* ---------- extrato: os lançamentos por trás de um número (duplo clique nos gráficos, links "ver") ---------- */
  const sinalDe = (l) => (l.tipo === "receita" || (l.tipo === "ajuste" && l.valor > 0) || l.tipo === "estorno" ? 1 : l.tipo === "transferencia" ? 0 : -1);
  function extrato(title, lancs, sub) {
    lancs = (lancs || []).slice().sort((a, b) => (b.pago || b.venc || b.comp || "").localeCompare(a.pago || a.venc || a.comp || ""));
    const tot = lancs.reduce((t, l) => t + sinalDe(l) * Math.abs(dinheiro(l)), 0);
    const rows = lancs.map((l) => { const c = F.cat(l.catId); const sg = sinalDe(l); return `<tr class="fin-row" data-ed="${l.id}"><td class="vg-d">${fdm(l.tipo === "compra" ? l.comp : F.dataCaixa(l))}</td><td><b>${esc(l.desc)}</b><div class="mut fin-sub">${l.catId ? esc(c.nome) : l.tipo === "pagfatura" ? "Pagamento de fatura" : l.tipo === "ajuste" ? "Ajuste de saldo" : ""}${l.favId && F.favorecido(l.favId) ? " · " + esc(F.favorecido(l.favId).nome) : ""} · ${origemTxt(l)}</div></td><td>${U.pill(F.situacao(l))}</td><td class="r ${sg > 0 ? "pos" : sg < 0 ? "neg" : ""}"><b>${sg > 0 ? "+ " : sg < 0 ? "− " : ""}${brl(Math.abs(dinheiro(l)))}</b></td></tr>`; }).join("");
    const m = ERP.modal(`<h2>${esc(title)}</h2>${sub ? `<p class="mut" style="margin:-6px 0 10px">${esc(sub)}</p>` : ""}${lancs.length ? `<div class="tw" style="max-height:60vh;overflow:auto"><table class="vg-tbl ex-tbl"><tbody>${rows}</tbody></table></div><div class="fp-foot"><span>${lancs.length} lançamento(s) · clique para abrir</span><span>Total: <b class="${tot < 0 ? "neg" : "pos"}">${brl(tot)}</b></span></div>` : `<div class="empty">Nenhum lançamento compõe este valor.</div>`}<div class="act"><button class="btn ghost" data-xls ${lancs.length ? "" : "disabled"}>Exportar Excel</button><span class="sp"></span><button class="btn" data-fechar>Fechar</button></div>`, { wide: true, noFocus: true });
    $("[data-fechar]", m.el).onclick = m.close;
    $("[data-xls]", m.el).onclick = () => ERP.xlsx(`hub-extrato-${todayISO()}.xlsx`, ["Data", "Descrição", "Favorecido", "Categoria", "Conta/Cartão", "Situação", "Valor"], lancs.map((l) => [l.tipo === "compra" ? l.comp : F.dataCaixa(l), l.desc, (F.favorecido(l.favId) || {}).nome || "", l.catId ? F.cat(l.catId).nome : "", l.cartaoId ? (F.cartao(l.cartaoId) || {}).nome : (F.conta(l.contaId) || {}).nome, F.situacao(l).n, sinalDe(l) * Math.abs(dinheiro(l))]), { title, subtitle: (sub ? sub + " · " : "") + "Hub · Painel Pessoal · gerado em " + new Date().toLocaleString("pt-BR"), sheet: "Extrato" });
    $$("[data-ed]", m.el).forEach((r) => (r.onclick = () => { const l = D().lanc.find((x) => x.id === r.dataset.ed); if (l && l.tipo !== "pagfatura" && l.tipo !== "ajuste") { m.close(); U.lancForm(l); } }));
    return m;
  }
  ERP.extrato = extrato;
  /* lançamentos de um mês (competência) por categoria/natureza */
  const lancsMes = (mk, f) => D().lanc.filter((l) => ["receita", "despesa", "compra", "estorno"].includes(l.tipo) && monthKey(F.dataComp(l)) === mk && (!f || f(l)));
  const lancsCaixaMes = (mk) => { const ids = new Set(F.contasAtivas().filter((c) => c.tipo !== "reserva").map((c) => c.id)); return D().lanc.filter((l) => l.pago && monthKey(l.pago) === mk && ids.has(l.contaId) && ["receita", "despesa", "pagfatura"].includes(l.tipo)); };
  const pendMes = (mk) => { const h = hoje(); return D().lanc.filter((l) => !l.pago && ["receita", "despesa"].includes(l.tipo) && monthKey(l.venc < h ? h : l.venc) === mk); };

  /* ---------- medidas compartilhadas ---------- */
  /* mês: realizado + previsto (competência), separados */
  function mesRealPrev(mk) {
    const r = { entR: 0, entP: 0, saiR: 0, saiP: 0, nAbertos: 0 };
    D().lanc.forEach((l) => {
      const c = F.cat(l.catId); if (c.natureza === "investimento") return;
      if (l.tipo === "receita" || l.tipo === "despesa") { if (monthKey(F.dataComp(l)) !== mk) return; const v = dinheiro(l); if (l.tipo === "receita") { if (l.pago) r.entR += v; else r.entP += v; } else { if (l.pago) r.saiR += v; else { r.saiP += v; r.nAbertos++; } } }
      else if (l.tipo === "compra" || l.tipo === "estorno") { if (monthKey(l.comp) !== mk) return; const v = l.tipo === "estorno" ? -l.valor : l.valor; r.saiR += v; }
    });
    return r;
  }
  function alertas() {
    const h = hoje(); const d = D(); const out = []; const pend = F.pendencias();
    const venc = pend.filter((p) => p.tipo !== "receita" && p.data < h);
    if (venc.length) out.push(["err", `${venc.length} conta(s) vencida(s) · ${brl(venc.reduce((s, p) => s + p.valor, 0))}`, "#/financas/agenda", "Pagar agora"]);
    const hj = pend.filter((p) => p.tipo !== "receita" && p.data === h); if (hj.length) out.push(["warn", `${hj.length} conta(s) vencendo hoje · ${brl(hj.reduce((s, p) => s + p.valor, 0))}`, "#/financas/agenda", "Ver"]);
    const est = d.lanc.filter((l) => l.estimado && !l.pago && l.venc <= F.addDias(h, 7)); if (est.length) out.push(["warn", `${est.length} valor(es) a confirmar nos próximos 7 dias (recorrências variáveis)`, "#/financas/lancamentos", "Confirmar"]);
    const pj = F.projecao(12); if (pj.min.v < 0 && pj.ini >= 0) out.push(["err", `Saldo projetado fica negativo em ${fdate(pj.min.data)} (${brl(pj.min.v)})`, "#/financas/fluxo", "Ver fluxo"]);
    d.cartoes.forEach((c) => { const u = F.usoCartao(c.id); if (c.limite > 0 && (u / c.limite) * 100 >= (d.cfg.alertaCartao || 80)) out.push(["warn", `${c.nome}: ${num((u / c.limite) * 100, 0)}% do limite usado`, "#/financas/cartoes", "Ver"]); });
    F.orcamentoMes(mkHoje()).filter((x) => x.orcado > 0 && x.pct > 100).slice(0, 3).forEach((x) => out.push(["warn", `Orçamento estourado em ${x.c.nome}: ${brl(x.realizado)} de ${brl(x.orcado)}`, "#/financas/orcamento", "Ver"]));
    const comp = d.lanc.filter((l) => l.pago && l.pago >= F.addDias(h, -90) && ["despesa", "receita"].includes(l.tipo) && !(l.anexos || []).length && l.valor >= 50).length; if (comp) out.push(["info", `${comp} pagamento(s) sem comprovante anexado (90 dias)`, "#/financas/agenda", "Anexar"]);
    const rec = pend.filter((p) => p.tipo === "receita" && p.data < h); if (rec.length) out.push(["info", `${rec.length} recebimento(s) atrasado(s) · ${brl(rec.reduce((s, p) => s + p.valor, 0))}`, "#/financas/agenda", "Ver"]);
    return out;
  }
  /* compromissos recorrentes ativos (séries), com o estado no mês */
  function ativas(mk) {
    const d = D(); const h = hoje();
    return d.series.filter((s) => s.ativa !== false && (!s.fim || monthKey(s.fim) >= mkHoje())).map((s) => {
      const ls = d.lanc.filter((l) => l.serieId === s.id);
      const noMes = ls.filter((l) => l.serieMes === mk);
      const prox = ls.filter((l) => !l.pago && (l.tipo === "compra" ? l.comp : l.venc) >= h).sort((a, b) => (a.venc || a.comp).localeCompare(b.venc || b.comp))[0];
      const ult = ls.filter((l) => l.pago).sort((a, b) => b.pago.localeCompare(a.pago))[0];
      const st = !noMes.length ? "fora" : noMes.every((l) => l.pago || l.tipo === "compra") ? "pago" : noMes.some((l) => !l.pago && l.venc < h && l.tipo !== "compra") ? "vencido" : "aberto";
      return { s, ls, noMes, prox, ult, st, mensal: mensal(s), valor: valorSerie(s) };
    });
  }

  /* ================= VISÃO GERAL ================= */
  function pGeral(root) {
    const d = D(); const h = hoje(); const mk = S.mk; const C = COR();
    const m = mesRealPrev(mk); const ent = m.entR + m.entP, sai = m.saiR + m.saiP, res = ent - sai;
    const saldo = F.saldoTotal(); const reservas = F.saldoReservas(); const fat = F.faturasAbertas(); const fatTot = fat.reduce((s, f) => s + f.total, 0);
    const al = alertas(); const pend = F.pendencias();
    const prox = pend.filter((p) => p.data <= F.addDias(h, 7)).slice(0, 8);
    const sd = F.saudeFinanceira();
    const at = ativas(mk); const fixosMes = at.filter((a) => a.s.tipo !== "receita").reduce((s, a) => s + a.mensal, 0);
    const R = F.dreMes(mk, "competencia"); const cats = Object.entries(R.porCat).filter(([k]) => F.cat(k).natureza !== "investimento").sort((a, b) => b[1] - a[1]);
    const orc = F.orcamentoMes(mk).filter((x) => x.orcado > 0).sort((a, b) => b.pct - a.pct).slice(0, 5);
    const mkAtual = mk === mkHoje();
    root.innerHTML = ERP.pagehead("Visão Geral", `${U.mesNav()}<button class="btn orange" id="vgNovo">+ Lançamento</button>`) + `
      <div class="kpis fp-4 vg-kpis">
        ${kpi("Saldo em Conta Hoje", brl(saldo), `${reservas ? `reservas à parte: <b>${brl(reservas)}</b> · ` : ""}${fat.length ? `faturas em aberto: <b>${brl(fatTot)}</b>` : "sem faturas em aberto"}`, saldo < 0 ? "neg" : "", "#/financas/analise", saldo < 0 ? "var(--err)" : "var(--ok)", "saldoHoje")}
        ${kpi("Entradas · " + monthLabel(mk), brl(ent), `recebido <b>${brl(m.entR)}</b> · previsto <b>${brl(m.entP)}</b>`, "pos", "#/financas/lancamentos", "var(--ok)")}
        ${kpi("Saídas · " + monthLabel(mk), brl(sai), `pago <b>${brl(m.saiR)}</b> · a pagar <b>${brl(m.saiP)}</b> (${m.nAbertos})`, "neg", "#/financas/lancamentos", "var(--err)")}
        ${kpi("Resultado do Mês", (res >= 0 ? "+ " : "− ") + brl(Math.abs(res)), ent > 0 ? `margem de <b>${num((res / ent) * 100, 1)}%</b> · compromissos fixos <b>${brl(fixosMes)}</b>/mês` : `compromissos fixos <b>${brl(fixosMes)}</b>/mês`, res >= 0 ? "pos" : "neg", "#/financas/fluxo", res >= 0 ? "var(--ok)" : "var(--err)", "resultadoMes")}
      </div>
      <div class="vg-grid">
        <div class="card vg-al"><h3>Precisa de Atenção <small class="mut">${al.length ? al.length + " item(ns)" : "tudo em dia"}</small></h3>
          ${al.length ? `<ul class="vg-alist">${al.map(([c, t, hr, b]) => `<li class="${c}"><span class="vg-dot"></span><span class="vg-at">${esc(t)}</span><a class="btn ghost sm" href="${hr}">${esc(b)}</a></li>`).join("")}</ul>` : `<div class="vg-ok">${ERP.ic("circle-check", 22)} Nenhuma pendência: nada vencido, orçamento e cartões dentro do limite.</div>`}
        </div>
        <div class="card vg-prox"><h3>Próximos 7 Dias <small class="mut">${brl(prox.reduce((s, p) => s + (p.tipo === "receita" ? p.valor : -p.valor), 0))} líquido</small><a class="vg-more" href="#/financas/agenda">ver agenda ↗</a></h3>
          ${prox.length ? `<table class="vg-tbl"><tbody>${prox.map((p) => `<tr class="${p.data < h ? "late" : ""}"><td class="vg-d">${p.data < h ? "venceu " : ""}${fdm(p.data)}</td><td><b>${esc(p.desc)}</b><div class="mut fin-sub">${p.k === "l" ? esc(F.cat(p.l.catId).nome) : p.f.itens.length + " compra(s)"}</div></td><td class="r ${p.tipo === "receita" ? "pos" : "neg"}"><b>${p.tipo === "receita" ? "+ " : "− "}${brl(p.valor)}</b></td><td class="r">${p.k === "l" ? `<button class="btn sm" data-pay="${p.l.id}">${p.tipo === "receita" ? "Receber" : "Pagar"}</button>` : `<button class="btn sm" data-payf="${p.f.cartao.id}|${p.f.key}">Pagar</button>`}</td></tr>`).join("")}</tbody></table>` : `<div class="vg-ok mut">Nada vence nos próximos 7 dias.</div>`}
        </div>
      </div>
      <div class="vg-grid vg-grid-b">
        <div class="card"><h3>Fluxo de Caixa${ERP.help("fluxoCaixa")} <small class="mut">6 meses realizados + 6 previstos · duplo clique numa barra abre os lançamentos</small><a class="vg-more" href="#/financas/fluxo">ver fluxo ↗</a></h3>${canvas("vgFluxo", 250)}</div>
        <div class="card vg-saude"><h3>Saúde Financeira <small class="mut">${sd.meses} mês(es) de dados · toque no ? para entender cada indicador</small><a class="vg-more" href="#/financas/relatorios">detalhes ↗</a></h3>
          <ul class="vg-slist">${sd.itens.map((it) => `<li class="${it.nivel}"><span class="saude-dot"></span><span class="vg-sn">${esc(it.nome)}${ERP.help({ poupanca: "taxaPoupanca", reserva: "reservaEmergencia", dividas: "comprometimento", fixo: "custoFixoRenda", custo: "variacaoCusto", cobertura: "coberturaCaixa" }[it.k] || "")}</span><b>${it.valor == null ? "—" : it.un === "%" ? num(it.valor, 1) + "%" : it.un === "meses" ? num(it.valor, 1) + " m" : num(it.valor, 2) + "×"}</b></li>`).join("")}</ul>
          <div class="vg-fixos"><span>Compromissos recorrentes${ERP.help("compromissos")}</span><b>${brl(fixosMes)}<small>/mês</small></b><a href="#/financas/ativas">${at.length} conta(s) ativa(s) ↗</a></div>
        </div>

<script>/* js/mod-investimentos.js */
/* Módulo Investimentos — carteira no exterior (IBKR) e no Brasil, movimentações, dividendos e apoio ao IRPF */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, usd, num, pct, todayISO, fdate, Store } = ERP;

  const CLASSES = [["acoes", "Ações / ETF de Ações"], ["rf", "Renda Fixa / ETF de Títulos"], ["commod", "Commodities"], ["cripto", "Criptoativos"], ["fii", "FIIs"], ["outro", "Outro"]];
  const CLN = Object.fromEntries(CLASSES);
  ERP.defaults.investimentos = {
    brokers: [{ id: "ibkr", name: "Interactive Brokers", country: "EUA", currency: "USD" }],
    assets: [],          /* {id,ticker,name,cls,brokerId,currency,price,priceAt,irpf} */
    moves: [],           /* {id,date,kind:compra|venda|dividendo|juros|imposto|deposito|saque|taxa,assetId,brokerId,qty,price,amount,fees,fx,notes} */
    fx: { current: 5.40, currentAt: "", ptax: { "2025-12-31": 5.5024 } },
    cash: { ibkr: 0 },
  };
  const D = () => Store.get("investimentos");
  const S = { year: new Date().getFullYear() - 1, broker: "" };
  const KIND = [["compra", "Compra"], ["venda", "Venda"], ["dividendo", "Dividendo (bruto)"], ["imposto", "Imposto Retido no Exterior"], ["juros", "Juros"], ["deposito", "Depósito (remessa)"], ["saque", "Saque"], ["taxa", "Taxa / Corretagem"]];
  const KN = Object.fromEntries(KIND);
  const asset = (id) => D().assets.find((a) => a.id === id) || { ticker: "?", name: "" };

  /* ---------- Ponte IBKR: lê o registro "ibkr" da tabela docs (gravado por um robô ou importado) ----------
     Formato esperado:
     { "asof":"2026-11-02T13:00:00Z", "fx":{"USDBRL":5.42}, "cashUSD":1500.0, "nav":12345.67,
       "positions":[{"ticker":"VOO","name":"Vanguard S&P 500 ETF","cls":"acoes","currency":"USD","qty":10,"price":480.12}] } */
  let ibkr = null, ibkrTried = false, ibkrBusy = false;
  function fetchIbkr() {
    if (ibkrTried || !ERP.Cloud || !ERP.Cloud.account) return; ibkrTried = true; ibkrBusy = true;

  }

  const ibkrMatch = (t) => D().assets.find((a) => (a.ticker || "").toUpperCase() === String(t || "").toUpperCase());
  function aplicarIbkr() {

    });

  }
  function criarAtivosIbkr() {
    const faltam = (ibkr.positions || []).filter((p) => +p.qty > 0 && !ibkrMatch(p.ticker));
    if (!faltam.length) { ERP.toast("Nenhum ativo novo na IBKR."); return; }
    ERP.confirm(`Criar ${faltam.length} ativo(s) que estão na IBKR e ainda não existem aqui, com uma compra de abertura (quantidade e preço atuais)? Confira depois o preço médio e o código do IRPF.`, "Criar").then((ok) => {
      if (!ok) return;
      Store.change("investimentos", (dd) => { const dt = (ibkr.asof || "").slice(0, 10) || todayISO(); faltam.forEach((p) => { const id = uid("as"); dd.assets.push({ id, ticker: String(p.ticker).toUpperCase(), name: p.name || "", cls: p.cls || "acoes", brokerId: "ibkr", currency: p.currency || "USD", price: +p.price || 0, priceAt: dt, irpf: "" }); dd.moves.push({ id: uid("mv"), date: dt, kind: "compra", assetId: id, brokerId: "ibkr", qty: +p.qty, price: +p.price || 0, fees: 0, notes: "Posição inicial importada da IBKR" }); }); });
      ERP.toast(`${faltam.length} ativo(s) criado(s).`); ERP.render();
    });
  }
  function ibkrCard() {
    if (!ERP.Cloud || !ERP.Cloud.account) return "";
    if (!ibkr) return ibkrBusy ? `<div class="card"><h3>Conexão IBKR</h3><p class="mut">Procurando dados da IBKR no OneDrive…</p></div>` : `<div class="card"><h3>Conexão IBKR</h3><p class="mut">Ainda não há o arquivo <code>ibkr.json</code> no OneDrive. Quando o robô gravar o arquivo, as posições, o caixa e o câmbio aparecem aqui para aplicar.</p></div>`;
    const pos = ibkr.positions || []; const asof = ibkr.asof ? new Date(ibkr.asof) : null;
    const novos = pos.filter((p) => +p.qty > 0 && !ibkrMatch(p.ticker)).length;
    return `<div class="card"><h3>Conexão IBKR <span class="pill ok">ao vivo</span></h3>
      <p class="mut" style="margin-bottom:8px">Dados gravados pelo robô no OneDrive${asof ? " · atualizado em " + asof.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) : ""}.${ibkr.nav != null ? " NAV " + usd(+ibkr.nav) + "." : ""} Caixa ${usd(+ibkr.cashUSD || 0)} · câmbio ${num(+((ibkr.fx || {}).USDBRL) || 0, 4)}.</p>
      <div class="tw"><table><thead><tr><th>Ativo</th><th class="r">Qtd.</th><th class="r">Cotação</th><th class="r">Valor</th><th>No Hub</th></tr></thead><tbody>${pos.map((p) => `<tr><td><b>${esc(p.ticker)}</b> <span class="mut" style="font-size:12px">${esc(p.name || "")}</span></td><td class="r">${num(+p.qty, 4)}</td><td class="r">${usd(+p.price || 0)}</td><td class="r">${usd((+p.qty || 0) * (+p.price || 0))}</td><td>${ibkrMatch(p.ticker) ? '<span class="pill ok">sim</span>' : '<span class="pill warn">novo</span>'}</td></tr>`).join("")}</tbody></table></div>
      <div class="toolbar" style="margin-top:10px"><button class="btn orange sm" id="ibApply">Aplicar cotações, caixa e câmbio</button>${novos ? `<button class="btn ghost sm" id="ibNew">Criar ${novos} ativo(s) que faltam</button>` : ""}</div></div>`;
  }


  /* posição pelo custo médio: retorna por ativo {qty, costCur, costBRL, realized[]} */
  function positions(until) {
    const P = {};
    D().moves.filter((m) => (!until || m.date <= until) && (m.kind === "compra" || m.kind === "venda")).sort((a, b) => a.date.localeCompare(b.date) || (a.kind === "compra" ? -1 : 1)).forEach((m) => {
      const p = (P[m.assetId] = P[m.assetId] || { qty: 0, costCur: 0, costBRL: 0, realized: [] });
      const fx = +m.fx || ptaxOn(m.date);
      if (m.kind === "compra") { const c = m.qty * m.price + (+m.fees || 0); p.qty += m.qty; p.costCur += c; p.costBRL += c * fx; }
      else {
        const share = p.qty > 0 ? Math.min(1, m.qty / p.qty) : 0; const cCur = p.costCur * share, cBRL = p.costBRL * share;
        const procCur = m.qty * m.price - (+m.fees || 0);
        p.realized.push({ date: m.date, qty: m.qty, procCur, procBRL: procCur * fx, costCur: cCur, costBRL: cBRL, gainBRL: procCur * fx - cBRL });
        p.qty -= m.qty; p.costCur -= cCur; p.costBRL -= cBRL; if (p.qty < 1e-9) { p.qty = 0; p.costCur = 0; p.costBRL = 0; }
      }
    });
    return P;
  }
  function ptaxOn(date) { const t = D().fx.ptax; const ks = Object.keys(t).filter((k) => k <= date).sort(); return ks.length ? +t[ks[ks.length - 1]] : +D().fx.current || 0; }
  function carteira() {
    const P = positions(); const d = D(); const rows = [];

    $$("[data-delptax]", root).forEach((b) => (b.onclick = () => { Store.change("investimentos", (dd) => { delete dd.fx.ptax[b.dataset.delptax]; }); ERP.render(); }));
    $("#brAdd", root).onclick = () => ERP.form({ title: "Nova Corretora", fields: [{ k: "name", label: "Nome", required: true }, { k: "country", label: "País", value: "Brasil" }, { k: "currency", label: "Moeda", type: "select", value: "BRL", options: [["BRL", "BRL"], ["USD", "USD"], ["EUR", "EUR"]] }], onSubmit(v) { Store.change("investimentos", (dd) => dd.brokers.push(Object.assign({ id: uid("br") }, v))); ERP.render(); } });
  }

  ERP.register({ id: "investimentos", label: "Investimentos", tab: "Investir", icon: "trending-up", group: "Finanças", pages: [
    { id: "carteira", label: "Carteira", icon: "chart-pie", render: pCarteira }, { id: "movimentacoes", label: "Movimentações", short: "Movimentações", icon: "arrow-left-right", render: pMov },
    { id: "ir", label: "Imposto de Renda", short: "Imposto de Renda", icon: "receipt", render: pIR }, { id: "config", label: "Configurações", short: "Configurações", icon: "settings", render: pConf } ] });
})();

<script>/* js/mod-patrimonio.js */
/* Patrimônio & Aposentadoria — no formato do Piloto 3.0: patrimônio bruto, rentabilidade, dívidas de curto prazo, líquido,
   cobertura, composição por espécie, projeto de aposentadoria, ativos e aplicações (R$/US$) com aportes e resgates,
   bens e dívidas, fotos mensais da evolução. Lê sozinho as contas e dívidas de Finanças e a carteira de Investimentos. */
(function () {
  "use strict";
  const { $, $$, esc, uid, brl, usd, num, todayISO, fdate, monthLabel, Store } = ERP;
  ERP.defaults.patrimonio = { items: [], snapshots: [] };
  const KIND = [["aplicacao", "Aplicação Financeira"], ["imovel", "Imóvel"], ["veiculo", "Veículo"], ["previdencia", "Previdência"], ["participacao", "Participação Societária"], ["outro_bem", "Outro Bem"], ["divida", "Dívida / Financiamento (fora de Finanças)"]];
  const KN = Object.fromEntries(KIND);
  const ESPECIES = ["Poupança", "CDB / Renda fixa", "Tesouro Direto", "Fundos", "Ações BR", "FIIs", "Ações / ETFs EUA", "Cripto", "Previdência privada", "Caixa / Conta", "Outros"];
  const PC = ["#8FA8C6", "#74C69D", "#7BA7DE", "#B49BE4", "#E0B060", "#E58F94", "#7FC4BD", "#C9A0E8", "#E9C46A", "#A5AFBD", "#9BB0C9", "#C3CCD9"];
  const D = () => Store.get("patrimonio");
  const fx = () => (ERP.investimentos ? +ERP.investimentos.fx() || 0 : 0);
  /* depreciação linear (como o Imobilizado do NMB): base = custo × (1 − residual), pela vida útil, a partir da aquisição */
  const DEP_PADRAO = { veiculo: { vida: 120, residual: 20 }, imovel: { vida: 0, residual: 100 }, outro_bem: { vida: 60, residual: 10 } };
  function depreciacao(i) {
    if (!["veiculo", "imovel", "outro_bem"].includes(i.kind)) return null;
    const custo = +i.cost || 0, vida = i.vidaUtil != null && i.vidaUtil !== "" ? +i.vidaUtil : (DEP_PADRAO[i.kind] || {}).vida, res = i.residual != null && i.residual !== "" ? +i.residual : (DEP_PADRAO[i.kind] || {}).residual;
    if (!custo || !vida || !i.aquisicao) return null;
    const m0 = new Date(i.aquisicao), h = new Date(); const meses = Math.max(0, (h.getFullYear() - m0.getFullYear()) * 12 + (h.getMonth() - m0.getMonth()));
    const base = custo * (1 - res / 100), mensal = base / vida, acum = Math.min(base, mensal * meses);
    return { custo, vida, res, meses, mensal, acum, atual: Math.max(custo * (res / 100), custo - acum), fim: new Date(m0.getFullYear(), m0.getMonth() + vida, 1) };
  }
  const emBRL = (i) => (i.moeda === "USD" ? (+i.value || 0) * fx() : +i.value || 0);
  const invBRL = (i) => (i.investido == null || i.investido === "" ? null : i.moeda === "USD" ? +i.investido * fx() : +i.investido);

  function total() {
    const F = ERP.fin; const h = todayISO(); const lim30 = F.addDias(h, 30);
    const contas = F.contasAtivas().map((c) => F.saldoConta(c.id));
    const accPos = contas.filter((v) => v > 0).reduce((s, v) => s + v, 0), accNeg = -contas.filter((v) => v < 0).reduce((s, v) => s + v, 0);
    const cart = ERP.investimentos.carteira(); const inv = cart.totalBRL;
    const items = D().items; const ativos = items.filter((i) => i.kind !== "divida");
    const bens = ativos.reduce((s, i) => s + emBRL(i), 0);
    const pend = F.pendencias().filter((p) => p.tipo !== "receita" && p.tipo !== "transferencia");
    const curto = accNeg + pend.filter((p) => p.data <= lim30).reduce((s, p) => s + p.valor, 0);
    const dividas = F.D().dividas.reduce((s, dv) => s + F.dividaInfo(dv).saldo, 0);
    const parc30 = F.D().lanc.filter((l) => l.dividaId && !l.pago && l.venc <= lim30).reduce((s, l) => s + l.valor, 0);
    const longo = Math.max(0, dividas - parc30) + items.filter((i) => i.kind === "divida").reduce((s, i) => s + (+i.value || 0), 0);
    const bruto = accPos + inv + bens; const usdBRL = (cart.mvUSD + cart.cashUSD) * fx() + ativos.filter((i) => i.moeda === "USD").reduce((s, i) => s + emBRL(i), 0);
    /* rentabilidade: aplicações com "investido" + carteira do exterior (custo em US$ ao câmbio de hoje) */
    const comBase = ativos.filter((i) => invBRL(i) != null); let investido = comBase.reduce((s, i) => s + invBRL(i), 0), atual = comBase.reduce((s, i) => s + emBRL(i), 0);
    cart.rows.forEach((r) => { if (r.a.currency === "USD") { investido += r.p.costCur * fx(); atual += r.mv * fx(); } });
    return { acc: accPos - accNeg, accPos, accNeg, inv, bens, bruto, usdBRL, curto, longo, div: curto + longo, net: bruto - curto - longo, investido, atual, rent: atual - investido, rentPct: investido > 0 ? ((atual - investido) / investido) * 100 : 0 };
  }
  ERP.patrimonio = { total };

  function itemForm(it) {
    const isNew = !it; it = it || { kind: "aplicacao", moeda: "BRL", especie: "CDB / Renda fixa", date: todayISO() };
    ERP.form({ title: isNew ? "Novo Ativo, Bem ou Dívida" : "Editar · " + it.name, wide: true, fields: [
      { k: "name", label: "Descrição", value: it.name, full: true, required: true, placeholder: "Ex.: CDB Santander 110% CDI, Apartamento, Carro" },
      { k: "kind", label: "Tipo", type: "select", value: it.kind, options: KIND },
      { k: "especie", label: "Espécie (aplicações)", type: "select", value: it.especie || "Outros", options: ESPECIES.map((e) => [e, e]) },
      { k: "moeda", label: "Moeda", type: "select", value: it.moeda || "BRL", options: [["BRL", "R$"], ["USD", "US$"]] },
      { k: "investido", label: "Total Investido (aplicações) — base da rentabilidade", type: "number", step: "0.01", value: it.investido },
      { k: "value", label: "Valor Atual (dívida: saldo devedor)", type: "number", step: "0.01", value: it.value },
      { k: "date", label: "Valor Atualizado em", type: "date", value: it.date },
      { k: "cost", label: "Custo de Aquisição em R$ (para o IRPF)", type: "number", step: "0.01", value: it.cost },
      { k: "aquisicao", label: "Data da Aquisição", type: "date", value: it.aquisicao || "" },
      { k: "vidaUtil", label: "Vida Útil (meses)", type: "number", value: it.vidaUtil != null ? it.vidaUtil : "", hint: "Veículo 120 (10 anos) · outro bem 60 · imóvel não deprecia. Vazio = padrão do tipo." },
      { k: "residual", label: "Valor Residual (%)", type: "number", value: it.residual != null ? it.residual : "", hint: "Quanto o bem ainda vale no fim da vida útil (veículo 20%)." },
      { k: "notes", label: "Observação", value: it.notes, full: true } ],
      init(fm, md) { const sync = () => { const ap = fm.elements.kind.value === "aplicacao" || fm.elements.kind.value === "previdencia"; const bem = ["veiculo", "imovel", "outro_bem"].includes(fm.elements.kind.value); md.show("aquisicao", bem); md.show("vidaUtil", bem && fm.elements.kind.value !== "imovel"); md.show("residual", bem && fm.elements.kind.value !== "imovel"); md.show("especie", ap); md.show("investido", ap); md.show("moeda", fm.elements.kind.value !== "divida"); }; fm.elements.kind.onchange = sync; sync(); },
      onSubmit(v) { if (v.investido === 0 && !String(it.investido || "")) v.investido = null; Store.change("patrimonio", (d) => { if (isNew) d.items.push(Object.assign({ id: uid("pt"), hist: [] }, v)); else Object.assign(d.items.find((x) => x.id === it.id), v); }); ERP.render(); },
      onDelete: isNew ? null : () => { Store.change("patrimonio", (d) => { d.items = d.items.filter((x) => x.id !== it.id); }); ERP.render(); } });
  }
  /* aporte / resgate (Piloto 3.0): ajusta investido e valor e, se quiser, lança em Finanças fora da DRE */
  function movForm(it, tipo) {
    const F = ERP.fin; const ap = tipo === "aporte";
    ERP.form({ title: (ap ? "Aporte em " : "Resgate de ") + it.name, intro: `Atual: ${it.moeda === "USD" ? usd(it.value) : brl(it.value)}${it.investido != null ? " · investido " + (it.moeda === "USD" ? usd(it.investido) : brl(it.investido)) : ""}.`,
      fields: [{ k: "valor", label: `Valor (${it.moeda === "USD" ? "US$" : "R$"})`, type: "number", step: "0.01" }, { k: "data", label: "Data", type: "date", value: todayISO() }, { k: "lanc", label: ap ? "Lançar a saída da conta em Finanças" : "Lançar a entrada na conta em Finanças", type: "checkbox", value: it.moeda !== "USD" }, { k: "contaId", label: "Conta", type: "select", options: F.contasAtivas().map((c) => [c.id, c.nome]) }],
      okLabel: ap ? "Registrar aporte" : "Registrar resgate",
      onSubmit(v) {
        if (!(v.valor > 0)) { ERP.toast("Informe o valor."); return false; }
        Store.change("patrimonio", (d) => { const x = d.items.find((y) => y.id === it.id); const s = ap ? 1 : -1; x.value = F.r2((+x.value || 0) + s * v.valor); if (x.investido != null || ap) x.investido = F.r2(Math.max(0, (+x.investido || 0) + s * v.valor)); x.date = v.data; (x.hist = x.hist || []).push({ em: v.data, tipo, v: v.valor }); });
        if (v.lanc) { const cats = F.D().categorias; const cid = (cats.find((c) => (ap ? /Aportes em investimentos/ : /Resgates de investimentos/).test(c.nome)) || {}).id; const brlV = it.moeda === "USD" ? v.valor * fx() : v.valor;
          ERP.finUI.salvar((dd) => dd.lanc.push({ id: uid("l"), tipo: ap ? "despesa" : "receita", desc: (ap ? "Aporte · " : "Resgate · ") + it.name, catId: cid, valor: F.r2(brlV), contaId: v.contaId, comp: v.data, venc: v.data, pago: v.data, valorPago: F.r2(brlV), forma: "Transferência", hist: [{ em: new Date().toISOString(), o: "Lançado pelo Patrimônio" }] })); }
        ERP.toast(ap ? "Aporte registrado." : "Resgate registrado."); ERP.render();
      } });
  }

  function render(root) {
    const t = total(); const d = D(); const F = ERP.fin; const c = F.D().cfg;
    const ativos = d.items.filter((i) => i.kind !== "divida");
    /* composição por espécie */
    const por = {}; const add = (k, v) => { if (v > 0) por[k] = (por[k] || 0) + v; };
    add("Caixa / Conta", t.accPos); add("Ações / ETFs EUA (Investimentos)", t.inv); ativos.forEach((i) => add(i.kind === "aplicacao" ? i.especie || "Outros" : KN[i.kind], emBRL(i)));
    const ents = Object.entries(por).sort((a, b) => b[1] - a[1]);
    /* aposentadoria (parâmetros de Metas e planejamento) */
    const anos = Math.max(1, (c.idadeApos || 60) - (c.idade || 40)); const i = Math.pow(1 + (c.retornoReal || 4) / 100, 1 / 12) - 1;
    let fv = Math.max(0, t.net); const serie = [{ x: 0, v: fv }]; for (let k = 1; k <= anos * 12; k++) { fv = fv * (1 + i) + (+c.aporteApos || 0); if (k % 12 === 0) serie.push({ x: k / 12, v: fv }); }
    const snaps = d.snapshots.slice().sort((a, b) => a.month.localeCompare(b.month)).slice(-24);
    root.innerHTML = ERP.pagehead("Patrimônio & Aposentadoria", `<button class="btn ghost" id="pSnap">Registrar Foto do Mês</button><button class="btn orange" id="pNew">+ Novo Ativo</button>`) + `
      <div class="fp-stats"><span>Patrimônio bruto<b>${brl(t.bruto)}</b></span><span>Patrimônio Líquido<b class="${t.net < 0 ? "neg" : "pos"}">${brl(t.net)}</b></span><span>Ativos<b>${ativos.length + (t.inv ? 1 : 0) + (t.accPos ? 1 : 0)}</b></span></div>
      <div class="kpis fp-4">
        ${ERP.kpi("Patrimônio Bruto", brl(t.bruto), `contas ${brl(t.accPos)} · exterior ${brl(t.inv)} · aplicações e bens ${brl(t.bens)}<br>em dólar ${brl(t.usdBRL)} (${t.bruto ? num((t.usdBRL / t.bruto) * 100, 1) : "0"}%)`)}
        ${ERP.kpi("Rentabilidade", t.investido ? (t.rent >= 0 ? "+" : "−") + brl(Math.abs(t.rent)) : "—", t.investido ? `${t.rent >= 0 ? "+" : ""}${num(t.rentPct, 1)}% sobre ${brl(t.investido)} investidos` : 'Informe o "total investido" nas aplicações', t.investido ? (t.rent >= 0 ? "pos" : "neg") : "")}
        ${ERP.kpi("Dívidas de Curto Prazo", brl(t.curto), "conta negativa + contas e faturas dos próximos 30 dias", t.curto ? "neg" : "")}
        ${ERP.kpi("Patrimônio Líquido", brl(t.net), `bruto − curto prazo − longo prazo (${brl(t.longo)})`, t.net < 0 ? "neg" : "pos")}</div>
      <p class="mut fin-leg" style="margin:-6px 0 14px">${t.curto > 0 ? (t.bruto >= t.curto ? `Cobertura: seus ativos cobrem <b>${num((t.bruto / t.curto) * 100, 0)}%</b> das dívidas de curto prazo.` : `Cobertura: os ativos cobrem <b>${t.bruto > 0 ? num((t.bruto / t.curto) * 100, 0) : 0}%</b> das dívidas de curto prazo — faltam <b>${brl(t.curto - t.bruto)}</b>.`) : "Sem dívidas de curto prazo."}</p>
      <div class="grid2"><div class="card"><h3 class="fp-h3">Composição por Espécie <small>convertido para R$ · US$ 1 = R$ ${num(fx(), 4)}</small></h3>${ents.length ? `<div class="fp-chart" style="height:260px"><canvas id="chPatCls"></canvas></div>` : `<div class="empty">Nenhum ativo ainda.<div class="toolbar" style="justify-content:center;margin-top:12px"><button class="btn orange sm" onclick="document.getElementById('pNew').click()">+ Novo Ativo</button></div></div>`}</div>
      <div class="card"><h3 class="fp-h3">Projeto de Aposentadoria <small>juros compostos · <a href="#/financas/metas">ajustar premissas</a></small></h3>
        <div class="fp-stats" style="margin:4px 0 6px"><span>Aporte mensal<b>${brl(c.aporteApos)}</b></span><span>Retorno real<b>${num(c.retornoReal || 4, 1)}% a.a.</b></span><span>Prazo<b>${anos} anos</b></span><span>Patrimônio projetado<b>${brl(fv)}</b></span><span>Retirada mensal esperada<b class="pos">${brl((fv * 0.04) / 12)}</b></span></div>
        <div class="fp-chart" style="height:200px"><canvas id="chApo"></canvas></div><p class="mut fin-leg">Parte do patrimônio líquido de hoje com aporte constante. Renda pela regra dos 4% ao ano.</p></div></div>
      <div class="card" style="padding:0"><div class="toolbar" style="padding:12px 14px 0"><b style="color:var(--navy)">Ativos e aplicações</b><span class="sp"></span><button class="btn sm" id="pNew2">+ Novo ativo</button></div>
        <div class="tw" style="border:0"><table><thead><tr><th>Ativo</th><th>Espécie</th><th class="r">Investido</th><th class="r">Valor Atual</th><th class="r">Em R$</th><th class="r">Retorno</th><th></th></tr></thead><tbody>
        ${t.inv ? `<tr><td><b>Carteira no exterior</b><div class="mut fin-sub">módulo Investimentos (IBKR)</div></td><td>Ações / ETFs EUA</td><td class="r mut" colspan="2"><a href="#/investimentos/carteira">abrir carteira</a></td><td class="r">${brl(t.inv)}</td><td></td><td></td></tr>` : ""}
        ${ativos.map((i) => { const f = (v) => (i.moeda === "USD" ? usd(v) : brl(v)); const ib = invBRL(i); const ret = ib != null ? emBRL(i) - ib : null; return `<tr><td><b>${esc(i.name)}</b><div class="mut fin-sub">${fdate(i.date)}${i.hist && i.hist.length ? " · " + i.hist.length + " movimento(s)" : ""}</div></td><td>${esc(i.kind === "aplicacao" ? i.especie || "Outros" : KN[i.kind])}</td><td class="r">${i.investido != null && i.investido !== "" ? f(i.investido) : "—"}</td><td class="r">${f(i.value)}${(() => { const dp = depreciacao(i); return dp && Math.abs(dp.atual - (+i.value || 0)) > 1 ? `<div class="mut fin-sub" title="Depreciação linear: ${num(dp.mensal, 2)}/mês · ${dp.meses} meses">depreciado ${brl(dp.atual)} <button class="ib" data-dep="${i.id}" title="Usar o valor depreciado como valor atual">↓</button></div>` : ""; })()}</td><td class="r">${brl(emBRL(i))}</td><td class="r ${ret == null ? "" : ret >= 0 ? "pos" : "neg"}">${ret == null ? "—" : (ret >= 0 ? "+" : "") + num(ib ? (ret / ib) * 100 : 0, 1) + "%"}</td><td class="r fp-acts">${i.kind === "aplicacao" || i.kind === "previdencia" ? `<button class="ib ok" data-ap="${i.id}" title="Aporte">＋</button><button class="ib" data-rs="${i.id}" title="Resgate">−</button>` : ""}<button class="ib" data-it="${i.id}" title="Editar">✎</button></td></tr>`; }).join("") || (t.inv ? "" : `<tr><td colspan="7" class="empty">Nenhum ativo cadastrado. Lance poupança, CDB, Tesouro, fundos, imóveis e veículos em R$ ou US$. <button class="btn orange sm" onclick="document.getElementById('pNew').click()">+ Novo Ativo</button></td></tr>`)}</tbody></table></div></div>
      ${d.items.some((i) => i.kind === "divida") ? `<div class="card"><h3>Outras Dívidas (fora de Finanças)</h3><div class="tw"><table><tbody>${d.items.filter((i) => i.kind === "divida").map((i) => `<tr data-it="${i.id}" class="fin-row"><td>${esc(i.name)}</td><td>${fdate(i.date)}</td><td class="r neg">−${brl(i.value)}</td></tr>`).join("")}</tbody></table></div></div>` : ""}
      <div class="card"><h3 class="fp-h3">Evolução do Patrimônio Líquido <small>fotos mensais</small></h3>${snaps.length ? `<div class="fp-chart" style="height:200px"><canvas id="chSnap"></canvas></div>` : `<div class="empty">Registre uma foto no fim de cada mês para acompanhar a evolução.<div class="toolbar" style="justify-content:center;margin-top:12px"><button class="btn ghost sm" onclick="document.getElementById('pSnap').click()">Registrar Foto do Mês</button></div></div>`}</div>`;
    $("#pNew", root).onclick = () => itemForm(); $("#pNew2", root).onclick = () => itemForm();
    $$("[data-it]", root).forEach((r) => (r.onclick = () => itemForm(d.items.find((x) => x.id === r.dataset.it))));
    $$("[data-dep]", root).forEach((b) => (b.onclick = (e) => { e.stopPropagation(); const it = d.items.find((x) => x.id === b.dataset.dep); const dp = depreciacao(it); if (!dp) return; ERP.confirm(`Atualizar o valor de "${it.name}" para ${brl(dp.atual)} (depreciação linear, ${dp.meses} meses desde a aquisição)?`, "Atualizar").then((ok) => { if (!ok) return; Store.change("patrimonio", (dd) => { const x = dd.items.find((y) => y.id === it.id); x.value = Math.round(dp.atual * 100) / 100; x.date = todayISO(); (x.hist = x.hist || []).push({ em: todayISO(), o: "Valor atualizado pela depreciação linear" }); }); ERP.render(); }); }));
    $$("[data-ap]", root).forEach((b) => (b.onclick = () => movForm(d.items.find((x) => x.id === b.dataset.ap), "aporte")));
    $$("[data-rs]", root).forEach((b) => (b.onclick = () => movForm(d.items.find((x) => x.id === b.dataset.rs), "resgate")));
    $("#pSnap", root).onclick = () => { const m = todayISO().slice(0, 7); Store.change("patrimonio", (dd) => { dd.snapshots = dd.snapshots.filter((s) => s.month !== m); dd.snapshots.push(Object.assign({ month: m, at: todayISO() }, total())); }); ERP.toast("Foto de " + monthLabel(m) + " registrada."); ERP.render(); };
    if (ents.length) ERP.chart($("#chPatCls", root), { type: "doughnut", data: { labels: ents.map((e) => e[0]), datasets: [{ data: ents.map((e) => e[1]), backgroundColor: ents.map((e, k) => PC[k % PC.length]), borderColor: ERP.cor("--white"), borderWidth: 2 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: "62%", plugins: { legend: { position: "right", labels: { boxWidth: 10 } }, tooltip: { callbacks: { label: (x) => ` ${x.label}: ${brl(x.parsed)}` } } } } });
    ERP.chart($("#chApo", root), { type: "line", data: { labels: serie.map((s) => "Ano " + s.x), datasets: [{ data: serie.map((s) => s.v), borderColor: "#8FA8C6", backgroundColor: "rgba(143,168,198,.15)", fill: true, tension: 0.25, borderWidth: 2, pointRadius: 2 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (x) => " " + brl(x.parsed.y) } } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { grid: { color: () => ERP.cor("--line") }, ticks: { callback: (v) => num(v / 1000, 0) + " mil" } } } } });
    if (snaps.length) ERP.chart($("#chSnap", root), { type: "line", data: { labels: snaps.map((s) => monthLabel(s.month)), datasets: [{ data: snaps.map((s) => s.net), borderColor: ERP.cor("--orange"), backgroundColor: "rgba(241,97,47,.10)", fill: true, tension: 0.25, pointRadius: 3 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (x) => " " + brl(x.parsed.y) } } }, scales: { x: { grid: { display: false } }, y: { grid: { color: () => ERP.cor("--line") } } } } });
  }
  ERP.register({ id: "patrimonio", label: "Patrimônio", icon: "landmark", group: "Finanças", render });
})();

</script>
<script>/* js/mod-sistema.js */
/* Sistema — conta e dados (Supabase), backup e restauração, dados de exemplo, aparência, glossário */
(function () {
  "use strict";
  const { $, $$, esc, todayISO, Store, Cloud } = ERP;

  /* restaura um backup (.json gerado pelo próprio Hub). "merge" junta pelo id; "replace" troca os módulos presentes no arquivo. */
  function importFile(file, mode) {
    const r = new FileReader();
    r.onload = async () => {
      let j; try { j = JSON.parse(r.result); } catch (e) { ERP.toast("Arquivo inválido."); return; }
      const docs = j.docs || (j.doc && j.data ? { [j.doc]: j.data } : null);
      if (!docs) { ERP.toast("Este arquivo não é um backup do Hub."); return; }
      const names = Object.keys(docs).filter((n) => ERP.defaults[n]);
      if (!names.length) { ERP.toast("O arquivo não tem módulos conhecidos."); return; }
      const label = names.map((n) => ({ financas: "Finanças", reminders: "Reminders", investimentos: "Investimentos", patrimonio: "Patrimônio" }[n] || n)).join(", ");
      if (!(await ERP.confirm(`${mode === "merge" ? "Juntar" : "Substituir"} os dados de: ${label}? ${mode === "merge" ? "Itens com o mesmo ID são atualizados; os demais são mantidos." : "Os dados atuais desses módulos serão trocados pelos do arquivo."}`, "Restaurar"))) return;
      names.forEach((n) => Store.change(n, (cur) => {
        const inc = docs[n];
        Object.keys(inc).forEach((k) => {
          if (mode === "merge" && Array.isArray(inc[k]) && Array.isArray(cur[k])) { const by = new Map(cur[k].map((x) => [x.id, x])); inc[k].forEach((x) => by.set(x.id, Object.assign(by.get(x.id) || {}, x))); cur[k] = Array.from(by.values()); }
          else if (mode === "merge" && inc[k] && typeof inc[k] === "object" && !Array.isArray(inc[k]) && cur[k] && typeof cur[k] === "object") cur[k] = Object.assign({}, cur[k], inc[k], k === "fx" ? { ptax: Object.assign({}, cur[k].ptax, inc[k].ptax) } : {});
          else cur[k] = inc[k];
        });
      }));
      ERP.toast("Restaurado: " + label); ERP.render();
    };
    r.readAsText(file);
  }

  function pDados(root) {
    const logado = !!Cloud.account;
    const u = Cloud.ultimoSalvamento ? Cloud.ultimoSalvamento() : null;
    const sujos = ERP.syncSujos ? ERP.syncSujos() : [], pend = ERP.syncPendentes ? ERP.syncPendentes() : [];
    const NM = { financas: "Finanças", reminders: "Reminders", investimentos: "Investimentos", patrimonio: "Patrimônio" };
    const lista = (a) => a.map((n) => NM[n] || n).join(", ");
    const estado = pend.length ? `<span class="pill warn">aguardando sua escolha</span>` : Cloud.status === "err" ? `<span class="pill err">não está salvando</span>` : sujos.length ? `<span class="pill warn">enviando…</span>` : logado ? `<span class="pill ok">em dia</span>` : `<span class="pill">só neste aparelho</span>`;
    root.innerHTML = ERP.pagehead("Dados e Sincronização") + `
      <div class="card"><h3>Sua Conta</h3>
        ${logado ? `<div class="kv"><div><span class="k">Conta</span><span class="v">${esc(Cloud.account.username)}</span></div>${Cloud.firstName() ? `<div><span class="k">Nome</span><span class="v">${esc(Cloud.account.name)}</span></div>` : ""}</div>
        <p class="mut" style="margin-top:10px">Login pela sua conta Microsoft pessoal. Cada conta vê somente os próprios dados.</p>
        <div class="toolbar" style="margin-top:12px"><button class="btn ghost" id="cOut">Sair da Conta</button></div>`
        : `<p class="mut" style="margin-bottom:12px">Você não entrou. O que você lançar fica só neste aparelho até entrar.</p><div class="toolbar"><button class="btn orange" id="cIn">Entrar com Microsoft</button></div>`}
      </div>
      <div class="card"><h3>Seus Dados</h3>
        <div class="kv">
          <div><span class="k">Situação</span><span class="v">${estado}</span></div>
          <div><span class="k">Onde ficam</span><span class="v">Na nuvem (banco de dados protegido por login e regras por usuário), com cópia de trabalho neste aparelho</span></div>
          <div><span class="k">Último salvamento</span><span class="v">${u ? esc(ERP.syncHora(u)) : "ainda não"}</span></div>
          <div><span class="k">Ainda não enviado</span><span class="v">${sujos.length ? esc(lista(sujos)) : '<span class="sync-ok">nada</span>'}</span></div>
          <div><span class="k">Decisão pendente</span><span class="v">${pend.length ? esc(lista(pend)) : '<span class="sync-ok">nenhuma</span>'}</span></div>
        </div>
        <div class="toolbar" style="margin-top:12px">${pend.length ? '<button class="btn orange" id="sgEsc">Escolher como juntar</button>' : ""}${logado ? '<button class="btn" id="cSync">Sincronizar Agora</button>' : ""}</div>
        <p class="mut" style="font-size:12.5px;margin-top:10px">Nos outros aparelhos, basta entrar com a mesma conta: os dados aparecem iguais. Se dois aparelhos alterarem o mesmo módulo ao mesmo tempo, o Hub pergunta antes de juntar — nunca descarta nada sozinho.</p>
      </div>
      <div class="card"><h3>Backup</h3>
        <p class="mut" style="margin-bottom:10px">Uma cópia completa dos seus dados em um arquivo <code>.json</code>, para guardar fora da nuvem. Para voltar a um backup, use "Restaurar".</p>
        <div class="toolbar"><button class="btn ghost" id="bExp">Exportar Backup (.json)</button><label class="btn ghost" style="cursor:pointer">Restaurar e Juntar<input type="file" accept=".json,application/json" id="iMerge" hidden></label><label class="btn ghost" style="cursor:pointer">Restaurar e Substituir<input type="file" accept=".json,application/json" id="iRep" hidden></label></div>
      </div>
      <div class="card"><h3>Dados de Exemplo</h3><p class="mut" style="margin-bottom:10px">Para conhecer Finanças com números: carrega uma conta, um cartão, recorrências, compras, um empréstimo e uma meta, todos marcados como exemplo. Remover apaga só eles.</p><div class="toolbar">${ERP.temExemplo() ? `<button class="btn ghost" id="exRem">Remover Exemplos</button>` : `<button class="btn ghost" id="exAdd">Carregar Exemplo</button>`}</div></div>
      <div class="card"><h3>Aparência</h3><p class="mut" style="margin-bottom:12px">O padrão é o modo claro. Escolha Escuro, ou Automático para seguir o modo do aparelho. O botão de lua/sol no menu alterna na hora.</p><div class="tabs" id="aTheme" style="margin:0">${[["light", "Claro"], ["dark", "Escuro"], ["auto", "Automático"]].map(([k, n]) => `<button data-th="${k}" class="${ERP.theme() === k ? "on" : ""}">${n}</button>`).join("")}</div></div>
      <div class="card"><h3>Sobre</h3><p>Hub ${esc(ERP.version)} · módulos: ${ERP.modules.map((m) => esc(m.label)).join(", ")}.</p><p class="mut" style="margin-top:6px">Página instalável (PWA). Dados na nuvem via Supabase; login Microsoft. O código no GitHub é público e não contém dados.</p></div>`;
    $("#aTheme", root).onclick = (e) => { const b = e.target.closest("[data-th]"); if (b) ERP.setTheme(b.dataset.th); };
    const i = $("#cIn", root); if (i) i.onclick = () => Cloud.login();
    const o = $("#cOut", root); if (o) o.onclick = async () => { if (await ERP.confirm("Sair da conta neste aparelho? Seus dados continuam na nuvem.", "Sair")) Cloud.logout(); };
    const s = $("#cSync", root); if (s) s.onclick = async () => { s.disabled = true; s.textContent = "Sincronizando…"; try { await Cloud.sincronizarAgora(); } finally { ERP.render(); } };
    const e1 = $("#sgEsc", root); if (e1) e1.onclick = () => Cloud.askConflict(ERP.syncPendentes());
    const ea = $("#exAdd", root); if (ea) ea.onclick = () => ERP.finExemplo();
    const er = $("#exRem", root); if (er) er.onclick = () => ERP.confirm("Remover todos os dados de exemplo?", "Remover").then((ok) => ok && ERP.finRemoverExemplo());
    $("#bExp", root).onclick = () => { Cloud.exportarBackup(); ERP.toast("Backup baixado."); };
    $("#iMerge", root).onchange = (e) => e.target.files[0] && importFile(e.target.files[0], "merge");
    $("#iRep", root).onchange = (e) => e.target.files[0] && importFile(e.target.files[0], "replace");
  }

  /* glossário: todos os termos técnicos usados nas telas, em linguagem simples */
  function pGlossario(root) {
    const q = (root._q || "").toLowerCase();
    const itens = Object.entries(ERP.GLOSS).map(([k, v]) => ({ k, t: v[0], d: v[1] })).sort((a, b) => a.t.localeCompare(b.t, "pt-BR"));
    root.innerHTML = ERP.pagehead("Glossário") + `<p class="mut" style="margin:-6px 0 14px">O que significa cada termo das telas. Nas telas, o botão <span class="hlp" style="cursor:default">?</span> ao lado de um termo abre esta explicação.</p>
      <div class="toolbar"><input id="glQ" placeholder="Buscar termo…" value="${esc(root._q || "")}" style="max-width:280px"></div>
      <div class="gloss">${itens.filter((i) => !q || (i.t + " " + i.d).toLowerCase().includes(q)).map((i) => `<div class="card" id="gl-${i.k}"><b>${esc(i.t)}</b><p>${esc(i.d)}</p></div>`).join("") || `<p class="mut">Nenhum termo encontrado.</p>`}</div>`;
    $("#glQ", root).oninput = (e) => { root._q = e.target.value; const v = e.target.value; pGlossario(root); const i = $("#glQ", root); i.focus(); i.setSelectionRange(v.length, v.length); };
  }
  ERP.register({ id: "sistema", label: "Sistema", icon: "settings", group: "Sistema", pages: [{ id: "dados", label: "Dados e Sincronização", icon: "cloud", render: pDados }, { id: "glossario", label: "Glossário", icon: "info", render: pGlossario }] });
})();

</script>
<script>ERP.boot();</script>
</body>
</html>
